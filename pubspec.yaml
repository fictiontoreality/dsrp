name: dsrp
description: Secure Remote Password (SRP-6a) for zero-knowledge authentication without transmitting password-equivalents.
version: 0.5.4
homepage: https://github.com/fictiontoreality/dsrp
repository: https://github.com/fictiontoreality/dsrp
issue_tracker: https://github.com/fictiontoreality/dsrp/issues
documentation: https://pub.dev/documentation/dsrp/latest/

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  cryptography: ^2.7.0
  logging: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

topics:
  - security
  - cryptography
  - authentication
  - srp
  - password
