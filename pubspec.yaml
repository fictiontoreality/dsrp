name: dsrp
description: Pure Dart implementation of Secure Remote Password (SRP) protocol for password authentication without transmitting credentials.
version: 0.5.2
homepage: https://codeberg.org/fictiontoreality/dsrp
repository: https://codeberg.org/fictiontoreality/dsrp
issue_tracker: https://codeberg.org/fictiontoreality/dsrp/issues
documentation: https://pub.dev/documentation/dsrp/latest/

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  cryptography: ^2.7.0
  logging: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

topics:
  - security
  - cryptography
  - authentication
  - srp
  - password
